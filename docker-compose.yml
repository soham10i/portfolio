# Portfolio — Unified Local Development
#
# Spins up:
#   - Portfolio web + API on http://localhost:3001
#   - Scene API (BLIP captioning) on http://localhost:8000
#
# Usage:
#   docker compose up --build
#
# The scene-api service requires an NVIDIA GPU. If you don't have one,
# comment out the scene-api service and set SCENE_API_BASE="" in backend/.env

services:
  # ── Portfolio Web + API ──
  portfolio:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - backend/.env
    environment:
      - PORT=3001
      - NODE_ENV=production
      - SCENE_API_BASE=http://scene-api:8000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      scene-api:
        condition: service_healthy
    networks:
      - portfolio-net

  # ── Scene Captioning API (BLIP) ──
  scene-api:
    build:
      context: ./scene-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - scene-api/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3.11", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    networks:
      - portfolio-net

networks:
  portfolio-net:
    driver: bridge
