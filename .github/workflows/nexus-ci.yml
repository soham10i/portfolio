# CI for nexus/, a separate project that lives in this repository until it is extracted
# (nexus/README.md, "Moving it out"). The portfolio's own ci.yml ignores these paths.
name: nexus-ci

on:
  push:
    branches: [main]
    paths: ["nexus/**", ".github/workflows/nexus-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["nexus/**", ".github/workflows/nexus-ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: nexus

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: nexus/uv.lock
      - name: Python 3.12
        run: uv python install
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -m "not integration"
      - name: Validate examples
        run: uv run nexus validate contracts/examples/valid
      - name: Licences
        run: make licenses

  integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      NEXUS_DB_URL: postgresql://nexus:nexus@localhost:5433/nexus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: nexus/uv.lock
      - name: Python 3.12
        run: uv python install
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Database tests
        run: uv run pytest -m integration
