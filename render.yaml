services:
  - type: web
    name: soham-portfolio
    runtime: node
    plan: free
    buildCommand: cd app && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # OpenAI-compatible model endpoint (vLLM / TGI / Ollama / gateway).
      # Must be reachable from Render — a laptop Ollama is not.
      - key: LLM_API_BASE
        sync: false  # Set this manually in Render dashboard
      - key: LLM_MODEL
        sync: false
      - key: LLM_VISION_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      # Optional: your FastAPI + BLIP captioning service
      - key: SCENE_API_BASE
        sync: false
      # Notes editing. Leave unset to make the notes section read-only.
      - key: ADMIN_TOKEN
        sync: false
      # Comma-separated origins allowed to call the API from a browser.
      # Unset in production means same-origin only, which is what a
      # single-service deploy wants.
      - key: ALLOWED_ORIGINS
        sync: false
