# Render Blueprint — Soham Patel portfolio
#
# ONE Web Service. Not a Static Site.
#
# This repository does not deploy as a static site and never can: a Render
# Static Site serves files from a CDN with no process behind it, so /api/chat,
# /api/scene, /api/medqa, /api/notes and /api/contact would all 404 and the
# only things left working would be the pages that compute entirely in the
# browser. The Express process is what makes this a portfolio that runs its
# demos rather than one that screenshots them.
#
# Setup:  Render Dashboard → Blueprints → New Blueprint → connect this repo.
# Render reads this file and prompts for the three keys marked `sync: false`.
#
# Every model id below was called for real on 2026-08-30 and answered 200 with
# non-empty content. See docs/PROVIDERS.md for the measurements and for the
# five ids that are commonly recommended and currently return 404.

services:
  - type: web
    name: soham-portfolio
    runtime: node
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /api/health

    # Two installs because the halves have opposite needs: the frontend needs
    # devDependencies (vite, tsc) to build and is then discarded; the backend
    # ships without them. `npm ci` over `npm install` so the lockfile decides
    # the tree — a build that resolves differently from local is a debugging
    # session nobody enjoys.
    buildCommand: |
      set -euo pipefail

      echo "── frontend ──"
      cd app
      npm ci --include=dev
      npm run build

      echo "── backend ──"
      cd ../backend
      npm ci --omit=dev

      echo "── verifying build output ──"
      cd ..
      test -f app/dist/index.html || { echo "FATAL: app/dist/index.html missing"; exit 1; }
      # Unfetched Git LFS objects arrive as ~130-byte text pointers and are
      # served as broken video. Catching it here fails the deploy instead of
      # shipping a portfolio whose demos do not play.
      for v in app/public/videos/*.mp4; do
        if head -c 40 "$v" | grep -q 'git-lfs.github.com'; then
          echo "FATAL: $v is an unfetched Git LFS pointer, not video."
          echo "       Run: git lfs install && git lfs pull, then re-push."
          exit 1
        fi
      done
      echo "build ok"

    startCommand: node backend/server.js

    envVars:
      # ── Core ────────────────────────────────────────────────────────────────
      # PORT is injected by Render; do not set it here.
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.11.0"

      # ── Chat (JARVIS, MedQA generation, SceneLab clip summaries) ────────────
      # Google AI Studio. Chosen for quota shape: its free tier is metered in
      # requests per day rather than tokens, which suits bursty portfolio
      # traffic made of short turns.
      #
      # gemini-3.5-flash-lite — verified 815ms.
      # NOT gemini-2.5-flash-lite (404, "no longer available to new users").
      # NOT gemini-2.5-flash     (16.4s, and returns empty content at small
      #                           max_tokens because hidden reasoning eats it).
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false                       # AIza…  https://aistudio.google.com/app/apikey

      # ── Vision (SceneLab keyframe captioning) ───────────────────────────────
      # NVIDIA NIM. llama-3.2-11b-vision-instruct captioned a 19KB JPEG in
      # 1463ms — the fastest working free vision model measured.
      #
      # NOT the 90B sibling: it timed out at 90s.
      # NOT Groq: it serves no vision model at all.
      # Qwen-VL would need OpenRouter credit — every Qwen vision model there is
      # paid. See docs/PROVIDERS.md if you decide to fund that.
      - key: LLM_VISION_PROVIDER
        value: nvidia
      - key: LLM_VISION_MODEL
        value: meta/llama-3.2-11b-vision-instruct
      - key: NVIDIA_API_KEY
        sync: false                       # nvapi-…  https://build.nvidia.com

      # ── Fallback ────────────────────────────────────────────────────────────
      # Tried once when the primary answers 429 or 5xx. It must be a DIFFERENT
      # vendor — that is its entire job.
      #
      # Groq rather than OpenRouter: gpt-oss-120b answered in 611ms, Groq's
      # quota is token-metered rather than capped near 50 requests/day, and the
      # OpenRouter key on file was returning 401 at the time of writing.
      - key: LLM_FALLBACK_PROVIDER
        value: groq
      - key: LLM_FALLBACK_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false                       # gsk_…  https://console.groq.com/keys

      # ── MedQA ───────────────────────────────────────────────────────────────
      # The retrieval index loads a quantised embedding model — the largest
      # allocation in this process. 512 MB is tight. Flip to "false" if the
      # instance starts OOM-restarting; the rest of the site stays healthy and
      # that route returns an honest 503.
      - key: MEDQA_ENABLED
        value: "true"

      # ── Optional ────────────────────────────────────────────────────────────
      # The project's own BLIP captioning service, IF you host it somewhere with
      # a GPU. It is deliberately not a service in this blueprint: its image is
      # built on nvidia/cuda + torch + pre-downloaded weights, several GB, and
      # Render's free plan has neither the disk for that build nor a GPU to run
      # it on. Deploy it on a GPU host and paste the URL here. Unset means
      # SceneLab captions with the vision model above; browser-side detection is
      # unaffected either way. See docs/SCENE_API.md.
      - key: SCENE_API_BASE
        sync: false

      # Omit and the notes section is read-only, which is correct for a public
      # deployment. Render generates and stores this value.
      - key: ADMIN_TOKEN
        generateValue: true

      # Same-origin only when unset — correct for this single-service topology.
      # Set only if the API is ever called from another domain.
      - key: ALLOWED_ORIGINS
        sync: false
