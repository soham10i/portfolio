# Render Blueprint — one web service serving the built SPA and the Express API
# from a single process, which is why there is no CORS to configure: the page
# and its API share an origin.
#
#   Render Dashboard → Blueprints → New Blueprint → connect this repo.
#
# Secrets are NOT in this file. Every `sync: false` value is entered once in the
# Render dashboard and never reaches the repository.

services:
  - type: web
    name: soham-portfolio
    runtime: node
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /api/health

    # Two installs because the two halves have opposite needs: the frontend
    # needs devDependencies (vite, tsc) to build and is then thrown away; the
    # backend ships without them. `npm ci` is used over `npm install` so the
    # lockfile decides the tree — a build that resolves differently from local
    # is a debugging session nobody enjoys.
    buildCommand: |
      set -euo pipefail

      echo "── frontend ──"
      cd app
      npm ci --include=dev
      npm run build

      echo "── backend ──"
      cd ../backend
      npm ci --omit=dev

      echo "── verifying build output ──"
      cd ..
      test -f app/dist/index.html || { echo "FATAL: app/dist/index.html missing"; exit 1; }
      # Git LFS objects that were not fetched arrive as ~130-byte text pointers
      # and are served as broken video. Catching it here fails the deploy
      # instead of shipping a portfolio whose demos do not play.
      for v in app/public/videos/*.mp4; do
        if head -c 40 "$v" | grep -q 'git-lfs.github.com'; then
          echo "FATAL: $v is an unfetched Git LFS pointer, not video."
          echo "       Enable Git LFS for this service, or run: git lfs pull"
          exit 1
        fi
      done
      echo "build ok"

    startCommand: node backend/server.js

    envVars:
      # ── Core ──
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.11.0"

      # ── Language model ──
      # LLM_PROVIDER selects an entry from backend/src/config/providers.js,
      # which supplies the base URL and a default model id. Only the key is a
      # secret. Explicit LLM_API_BASE / LLM_MODEL override the preset.
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash-lite
      - key: LLM_VISION_MODEL
        value: gemini-2.5-flash-lite
        value: gemini-2.5-flash
      - key: LLM_VISION_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false

      # A different vendor, tried once when the primary answers 429 or 5xx.
      # Free tiers rate-limit hard; without this a quota wall takes chat down.
      - key: LLM_FALLBACK_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false

      # Vision is resolved independently of text — as of Aug 2026 NVIDIA's free
      # text models are EOL while its vision models still answer.
      - key: LLM_VISION_PROVIDER
        value: gemini

      # ── MedQA ──
      # The retrieval index loads a quantised embedding model, the largest
      # allocation in this process. 512 MB is tight; flip to "false" if the
      # instance starts OOM-restarting under load.
      - key: MEDQA_ENABLED
        value: "true"

      # ── Optional ──
      # The project's own BLIP captioning service, once it is hosted. Unset
      # means SceneLab captions with the vision model instead.
      - key: SCENE_API_BASE
        sync: false

      # Omit and the notes section is read-only, which is correct for a public
      # deployment. Render generates and stores this if left as-is.
      - key: ADMIN_TOKEN
        generateValue: true

      # Same-origin only when unset. Set only if the API is called from another
      # domain — it is not, in this single-service topology.
      - key: ALLOWED_ORIGINS
        sync: false
