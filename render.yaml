services:
  - type: web
    name: soham-portfolio
    runtime: node
    plan: free
    buildCommand: cd app && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false  # Set this manually in Render dashboard
