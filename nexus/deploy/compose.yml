# Local Postgres 16 + pgvector for NEXUS (ADR-0003). P0 has this one service only.
#   docker compose -f deploy/compose.yml up -d --wait
#   NEXUS_DB_URL=postgresql://nexus:nexus@localhost:5433/nexus
name: nexus

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus # local development only
      POSTGRES_DB: nexus
    ports:
      - "5433:5432" # 5433 so a Postgres the portfolio may run on 5432 is left alone
    volumes:
      - nexus-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  nexus-db:
