[project]
name = "nexus"
version = "0.0.1"
description = "NEXUS: a governed industrial agentic runtime. The LLM proposes, the runtime disposes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "jsonschema[format-nongpl]>=4.23",
  "referencing>=0.35",
  "pydantic>=2.9",
  "pyyaml>=6.0.2",
  "rfc8785>=0.1.4",
  "asyncpg>=0.30",
  "cel-python>=0.5,<0.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "pip-licenses>=5.0",
]

[project.scripts]
nexus = "nexus.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

# The schemas are canonical at contracts/v1/ and ship inside the wheel, so an
# installed package validates without the source tree.
[tool.hatch.build.targets.wheel.force-include]
"contracts/v1" = "nexus/contracts/schemas/v1"

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ANN", "RUF", "SIM", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "S603", "S607", "S311", "S608"]  # seeded test RNG; SQL built from test schema names

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: needs a running Postgres (NEXUS_DB_URL)"]
