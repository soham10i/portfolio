# P7 entity-resolution suite (P7.md §4, A4): 50 phrases resolved against the greenhouse pack and
# a second, eval-only pack that shares the alias "drip line" with it. A case passes when the
# mentions are exactly the expected ones. No model is involved; every case must pass, also with
# the packs loaded in the other order. Synthetic, nothing private.
packs:
  - pack: orchard
    assets:
      - {id: orchard, kind: site, name: Orchard}
      - {id: "orchard.row[*]", kind: row, name: Row, parent: orchard, count: 6}
      - {id: orchard.drip, kind: irrigation, name: Drip line, parent: orchard, aliases: [drip]}
      - {id: orchard.pump, kind: pump, name: Pump, parent: orchard, aliases: [water pump]}
cases:
  - {id: r01, text: "Set zone 2 to 21", expect: [{text: zone 2, status: resolved, entities: ["greenhouse.zone[2]"]}]}
  - {id: r02, text: "zone two", expect: [{text: zone two, status: resolved, entities: ["greenhouse.zone[2]"]}]}
  - {id: r03, text: "the second zone", expect: [{text: second zone, status: resolved, entities: ["greenhouse.zone[2]"]}]}
  - {id: r04, text: "z3 lights", expect: [{text: z3, status: resolved, entities: ["greenhouse.zone[3]"]}]}
  - {id: r05, text: "bed 4", expect: [{text: bed 4, status: resolved, entities: ["greenhouse.zone[4]"]}]}
  - {id: r06, text: "zone #1", expect: [{text: "zone #1", status: resolved, entities: ["greenhouse.zone[1]"]}]}
  - {id: r07, text: "zone number 3", expect: [{text: zone number 3, status: resolved, entities: ["greenhouse.zone[3]"]}]}
  - {id: r08, text: "zones 1 and 3", expect: [{text: zones 1 and 3, status: resolved, entities: ["greenhouse.zone[1]", "greenhouse.zone[3]"]}]}
  - {id: r09, text: "zones 1, 2, and 4", expect: [{text: "zones 1, 2, and 4", status: resolved, entities: ["greenhouse.zone[1]", "greenhouse.zone[2]", "greenhouse.zone[4]"]}]}
  - {id: r10, text: "all zones", expect: [{text: all zones, status: resolved, entities: ["greenhouse.zone[1]", "greenhouse.zone[2]", "greenhouse.zone[3]", "greenhouse.zone[4]"]}]}
  - {id: r11, text: "all four zones", expect: [{text: all four zones, status: resolved, entities: ["greenhouse.zone[1]", "greenhouse.zone[2]", "greenhouse.zone[3]", "greenhouse.zone[4]"]}]}
  - {id: r12, text: "every zone", expect: [{text: every zone, status: resolved, entities: ["greenhouse.zone[1]", "greenhouse.zone[2]", "greenhouse.zone[3]", "greenhouse.zone[4]"]}]}
  - {id: r13, text: "all of the zones", expect: [{text: all of the zones, status: resolved, entities: ["greenhouse.zone[1]", "greenhouse.zone[2]", "greenhouse.zone[3]", "greenhouse.zone[4]"]}]}
  - {id: r14, text: "zone 7", expect: [{text: zone 7, status: unknown}]}
  - {id: r15, text: "zone 0", expect: [{text: zone 0, status: unknown}]}
  - {id: r16, text: "which zone is warmest?", expect: [{text: zone, status: ambiguous, candidates: ["greenhouse.zone[1]", "greenhouse.zone[2]", "greenhouse.zone[3]", "greenhouse.zone[4]"]}]}
  - {id: r17, text: "open the roof vent", expect: [{text: roof vent, status: resolved, entities: [greenhouse.roof_vent]}]}
  - {id: r18, text: "how open is the vent", expect: [{text: vent, status: resolved, entities: [greenhouse.roof_vent]}]}
  - {id: r19, text: "the boiler", expect: [{text: boiler, status: resolved, entities: [greenhouse.heater]}]}
  - {id: r20, text: "main heater", expect: [{text: main heater, status: resolved, entities: [greenhouse.heater]}]}
  - {id: r21, text: "the glasshouse", expect: [{text: glasshouse, status: resolved, entities: [greenhouse]}]}
  - {id: r22, text: "water zone 2 with 3 litres", expect: [{text: water, status: resolved, entities: [greenhouse.drip]}, {text: zone 2, status: resolved, entities: ["greenhouse.zone[2]"]}]}
  - {id: r23, text: "zone 2 and 3 litres", expect: [{text: zone 2, status: resolved, entities: ["greenhouse.zone[2]"]}]}
  - {id: r24, text: "the drip line", expect: [{text: drip line, status: ambiguous, candidates: [greenhouse.drip, orchard.drip]}]}
