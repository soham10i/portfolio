  - {id: r40, text: "zone 1 then zone 4", expect: [{text: zone 1, status: resolved, entities: ["greenhouse.zone[1]"]}, {text: zone 4, status: resolved, entities: ["greenhouse.zone[4]"]}]}
  - {id: r41, text: "the third bed", expect: [{text: third bed, status: resolved, entities: ["greenhouse.zone[3]"]}]}
